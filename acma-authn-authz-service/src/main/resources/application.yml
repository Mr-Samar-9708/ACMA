spring: 
  application: 
          name: acma-authn-authz-service
  data:
    redis:
      host: ${ACMA_CACHE_HOST:localhost}
      port: ${ACMA_CACHE_PORT:6379}
      username: ${ACMA_CACHE_USER_NAME:username}
      password: ${ACMA_CACHE_PASSWORD:password}
      
  security:
    oauth2:
      client:
        registration:
          keycloak: 
            provider: keycloak
            client-id: ${ACMA_PUB_CLIENT:otto-insurer}
            client-secret: ${ACMA_CLIENT_SECRET:e1gSOlzoXVRs7cyZqTwwXn7B8Vft9s2d}
            authorization-grant-type: ${ACMA_PUB_CLIENT_GRANT_TYPE:authorization_code}
            redirect-uri: "{baseUrl}/login/oauth2/code/"
            scope: 
             - openid             
        provider:
          keycloak: 
            issuer-uri: http://${IAM_HOST:localhost}:${IAM_PORT:8081}/realms/${IAM_REALM:acma}
            token-uri: http://${IAM_HOST:localhost}:${IAM_PORT:8081}/realms/${IAM_REALM:acma}/protocol/openid-connect/token

eureka:
  client:
    service-url:
      defaultZone: http://${ACMA_REGISTRY_HOST:localhost}:${ACMA_REGISTRY_PORT:8761}/eureka/
      fetch-registry: true
      registry-with-eureka: true

  instance:
    hostname: ${ACMA_REGISTRY_HOST:localhost}
    #prefer-ip-address: true  
        
management:
  endpoints:
    web:
      exposure:
        exclude: "*"
        
            
            
server:
  port: ${APP_PORT:5052}
            
        
      
          
